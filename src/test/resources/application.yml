server:
  port: 0

spring:
  application:
    name: newtonite-ops-test

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/newtonite_ops}
    username: ${DB_USERNAME:newtonite}
    password: ${DB_PASSWORD:newtonite}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
  outbox:
    enabled: false # Disabled during standard tests to prevent background polling noise
    poll-interval-ms: 1000
    batch-size: 5
    max-attempts: 3
