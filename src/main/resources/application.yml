server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: newtonite-ops

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/newtonite_ops}
    username: ${DB_USERNAME:newtonite}
    password: ${DB_PASSWORD:newtonite}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  outbox:
    enabled: true
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:3000}
    batch-size: ${OUTBOX_BATCH_SIZE:10}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
